calendar: dates_t
hidden_sheets: [dates_t, per_employee_monthly_cost]

vars:
  active_tas: [Ophthalmology, TA2, TA3, TA4, TA5]
  cost_depts: ["Sales and Marketing", "G&A", Engineering, "Product Support"]
  year_rollup:
    year_totals: true
    grand_total: true
    grand_total_label: "6-yr Total"
  month_axis:
    col: month_idx
    labels: dates
  type_labels:
    A: "Type A (Small)"
    B: "Type B (Medium)"
    C: "Type C (Large)"
  cost_line_items:
    "Sales and Marketing":
      - "US staff on-costs"
      - "Events"
      - "Comms"
      - "Web site"
      - "Advertising"
      - "Consultants"
      - "Sales literature"
      - "Entertainment "
      - "Travel - National"
      - "Travel - International"
    "G&A":
      - "Bonus"
      - "Staff Welfare"
      - "Recruitment"
      - "Insurance"
      - "Rent"
      - "Building costs"
      - "Cleaning"
      - "Telephone & Internet"
      - "IT costs"
      - "Printing and stationery"
      - "Postage, freight and courier services"
      - "Accounting and Audit"
      - "Professional Fees"
      - "Legal Fees"
      - "Consultants"
      - "Subscriptions"
      - "Training"
      - "Travel"
      - "Entertaining"
      - "Bank charges"
      - "Management Expenses"
    Engineering:
      - "Bonus"
      - "Contractors"
      - "Consumables"
      - "Travel"
      - "Approvals"
      - "Validation Data"
      - "Expenses and Consumables"
      - "IT Software and Consumables"
    "Product Support":
      - "Bonus"
      - "Travel"
      - "Technical services"
      - "IT Security"

templates:
  per_ta:
    params: [ta]
    blocks:
      - kind: title
        text: "{ta}"
        level: 2
      - kind: title
        text: "{ta} — client starts per month"
        level: 3
      - kind: table
        source: schedule_t
        filter:
          ta: "{ta}"
        axis: $month_axis
        rows:
          kind: pivot-rows
          label_col: type
          label_header: Type
          value_col: starts
          label_map: $type_labels
          format: count
        totals_row:
          label: Total starts
        rollup: $year_rollup
        default_format: count
        canonical: [schedule_t]
      - kind: title
        text: "{ta} — active trials per month"
        level: 3
      - kind: table
        source: active_by_ta_type_month
        filter:
          ta: "{ta}"
        axis: $month_axis
        rows:
          kind: pivot-rows
          label_col: type
          label_header: Type
          value_col: active
          label_map: $type_labels
          format: count
        totals_row:
          label: Total active
          bold: true
        rollup: $year_rollup
        default_format: count
      - kind: title
        text: "{ta} — modeller commission ($)"
        level: 3
      - kind: table
        source: modeller_commission_per_ta_monthly
        filter:
          ta: "{ta}"
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: commission
              label: Modeller commission
        rollup: $year_rollup
      - kind: spacer
        rows: 1

  per_dept_sm:
    params: [dept]
    blocks:
      - kind: title
        text: "{dept}"
        level: 2
      - kind: table
        source: cost_line_items_t
        axis: $month_axis
        default_format: money
        rollup: $year_rollup
        canonical: [cost_line_items_t]
        rows:
          kind: explicit
          label_header: Line
          rows:
            - source: cost_dept_total_monthly_with_actuals
              identity:
                cost_dept: "{dept}"
              value_col: staff
              label: Staff Costs
            - source: sales_commission_monthly
              identity: {}
              value_col: sales_commission
              label: "Sales Commission (modeled)"
            - for_each: $cost_line_items.{dept}
              as: line_item
              source: cost_line_items_t
              identity:
                dept: "{dept}"
                line_name: "{line_item}"
              value_col: value
              label: "{line_item}"
            - source: cost_dept_total_monthly_with_actuals
              identity:
                cost_dept: "{dept}"
              value_col: total
              label: "Total {dept}"
              bold: true
      - kind: spacer
        rows: 1

  per_dept_other:
    params: [dept]
    blocks:
      - kind: title
        text: "{dept}"
        level: 2
      - kind: table
        source: cost_line_items_t
        axis: $month_axis
        default_format: money
        rollup: $year_rollup
        canonical: [cost_line_items_t]
        rows:
          kind: explicit
          label_header: Line
          rows:
            - source: cost_dept_total_monthly_with_actuals
              identity:
                cost_dept: "{dept}"
              value_col: staff
              label: Staff Costs
            - for_each: $cost_line_items.{dept}
              as: line_item
              source: cost_line_items_t
              identity:
                dept: "{dept}"
                line_name: "{line_item}"
              value_col: value
              label: "{line_item}"
            - source: cost_dept_total_monthly_with_actuals
              identity:
                cost_dept: "{dept}"
              value_col: total
              label: "Total {dept}"
              bold: true
      - kind: spacer
        rows: 1

  per_dept_yearly:
    params: [dept]
    blocks:
      - kind: title
        text: "{dept}"
        level: 3
      - kind: table
        source: cost_dept_yearly
        filter:
          cost_dept: "{dept}"
        rows:
          kind: value-columns
          columns:
            - col: staff
              label: Staff
            - col: non_staff
              label: Non-staff
            - col: total
              label: Total opex
              bold: true
        default_format: money

  per_dept_actuals:
    params: [dept]
    blocks:
      - kind: title
        text: "{dept} — monthly actuals"
        level: 3
      - kind: table
        source: cost_dept_monthly_actuals_t
        filter:
          cost_dept: "{dept}"
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: staff_actual
              label: "Staff (actual)"
            - col: non_staff_actual
              label: "Non-staff (actual)"
            - col: total_actual
              label: "Total (actual)"
        rollup: $year_rollup
        default_format: money
        canonical: [cost_dept_monthly_actuals_t]

sections:
  - id: revenue-model
    label: Revenue Model
    hint: "Pricing, per-TA monthly revenue (starts → active → platform / project / PM), modeller commission, aggregates."
    blocks:
      - kind: title
        text: Pricing assumptions
      - kind: table
        id: pricing
        source: pricing_t
        rows:
          kind: table-rows
          label_col: type
          label_header: Type
          column_formats:
            sites: count
        default_format: money
        canonical: [pricing_t]
      - kind: spacer
        rows: 1
      - kind: title
        text: Commission assumptions
      - kind: table
        id: commission
        source: commission_t
        rows:
          kind: value-columns
          columns:
            - col: rate
              label: "Modeller commission rate"
              format: percent
            - col: cap_per_month
              label: "Modeller cap (per TA / month)"
              format: money
            - col: sales_per_client
              label: "Sales commission per new client"
              format: money
            - col: sales_invoice_rate
              label: "Sales commission invoice rate"
              format: percent
        canonical: [commission_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Monthly revenue ($)"
      - kind: table
        id: monthly-revenue
        source: ta_monthly_total
        axis: $month_axis
        rows:
          kind: explicit
          label_header: ""
          rows:
            - source: hubspot_total_monthly
              identity: {}
              value_col: hubspot
              label: "HubSpot pipeline (subtotal)"
              bold: true
            - for_each: $active_tas
              as: ta
              identity:
                ta: "{ta}"
              value_col: total
              label: "{ta}"
            - source: modeled_total_monthly
              identity: {}
              value_col: total
              label: "Modeled TAs (subtotal)"
              bold: true
            - source: revenue_monthly
              identity: {}
              value_col: revenue
              label: "Grand total (HubSpot + modeled)"
              bold: true
        rollup: $year_rollup
      - kind: spacer
        rows: 2
      - kind: title
        text: Per-therapeutic-area monthly detail
      - kind: repeat
        template: per_ta
        over: $active_tas
        bind: ta
      - kind: title
        text: "Aggregates (used by Costs / Budget)"
      - kind: table
        id: starts-aggregate
        source: starts_per_month
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: total_starts
              label: "Total client starts"
              format: count
        rollup: $year_rollup
        default_format: count
      - kind: table
        id: commission-aggregate
        source: modeller_commission_monthly
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: modeller_commission
              label: "Total modeller commission"
        rollup: $year_rollup

  - id: hubspot
    label: HubSpot Pipeline
    hint: "Pipeline by therapeutic area / line item / month, pulled from HubSpot sync. Each deal is allocated to a TA via the rules below."
    blocks:
      - kind: title
        text: "Deal → TA allocation rules"
      - kind: paragraph
        italic: true
        text: "Case-insensitive regex tested against each deal name during sync. The first matching rule's TA wins; if no rule matches, the deal goes to the default TA (\"Ophthalmology\"). Rules take effect on the next \"Sync from HubSpot\". To add a new TA: set the pattern (e.g. `\\b(liver|mash|hepatic)\\b`) and the TA name (e.g. `Hepatology`); the engine starts bucketing matching deals there."
      - kind: table
        id: ta-rules
        source: hubspot_ta_rules_t
        rows:
          kind: table-rows
          label_col: idx
          label_header: "#"
        canonical: [hubspot_ta_rules_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "HubSpot pipeline per TA × month"
      - kind: table
        id: per-ta-monthly
        source: hubspot_per_ta_monthly
        axis: $month_axis
        rows:
          kind: pivot-rows
          label_header: TA
          label_col: ta
          value_col: hubspot
          format: money
        totals_row:
          label: "Total HubSpot pipeline"
          bold: true
        rollup: $year_rollup
      - kind: spacer
        rows: 2
      - kind: title
        text: "HubSpot pipeline by line item × month"
      - kind: table
        id: by-line-item
        source: hubspot_pipeline_t
        axis: $month_axis
        rows:
          kind: pivot-rows
          label_header: "Line item"
          label_col: line_item
          value_col: value
          format: money
        totals_row:
          label: Total
          bold: true
        rollup: $year_rollup
        canonical: [hubspot_pipeline_t]

  - id: total-revenue
    label: Total Revenue
    hint: "HubSpot pipeline + modeled per-TA revenue."
    blocks:
      - kind: title
        text: "Per-TA revenue (modeled + HubSpot + adjustments)"
      - kind: paragraph
        italic: true
        text: "Each TA row stacks its modeled pipeline (platform + project + PM), its allocated HubSpot pipeline, any manual revenue adjustments, and the total. Deals are bucketed into TAs at sync time using the rules on the HubSpot tab; with the default config every HubSpot deal routes to Ophthalmology. Adjustments default to v4's six 2026 Ophthalmology budget tweaks."
      - kind: table
        id: per-ta
        source: ta_monthly_with_hubspot
        axis: $month_axis
        rows:
          kind: explicit
          label_header: TA
          rows:
            - identity:
                ta: Ophthalmology
              value_col: total_modeled
              label: "Ophthalmology — modeled"
            - identity:
                ta: Ophthalmology
              value_col: hubspot
              label: "Ophthalmology — HubSpot"
            - identity:
                ta: Ophthalmology
              value_col: adjustment
              label: "Ophthalmology — adjustment"
            - identity:
                ta: Ophthalmology
              value_col: total
              label: "Ophthalmology — total"
              bold: true
            - identity:
                ta: TA2
              value_col: total_modeled
              label: "TA2 — modeled"
            - identity:
                ta: TA2
              value_col: hubspot
              label: "TA2 — HubSpot"
            - identity:
                ta: TA2
              value_col: adjustment
              label: "TA2 — adjustment"
            - identity:
                ta: TA2
              value_col: total
              label: "TA2 — total"
              bold: true
            - identity:
                ta: TA3
              value_col: total_modeled
              label: "TA3 — modeled"
            - identity:
                ta: TA3
              value_col: hubspot
              label: "TA3 — HubSpot"
            - identity:
                ta: TA3
              value_col: adjustment
              label: "TA3 — adjustment"
            - identity:
                ta: TA3
              value_col: total
              label: "TA3 — total"
              bold: true
            - identity:
                ta: TA4
              value_col: total_modeled
              label: "TA4 — modeled"
            - identity:
                ta: TA4
              value_col: hubspot
              label: "TA4 — HubSpot"
            - identity:
                ta: TA4
              value_col: adjustment
              label: "TA4 — adjustment"
            - identity:
                ta: TA4
              value_col: total
              label: "TA4 — total"
              bold: true
            - identity:
                ta: TA5
              value_col: total_modeled
              label: "TA5 — modeled"
            - identity:
                ta: TA5
              value_col: hubspot
              label: "TA5 — HubSpot"
            - identity:
                ta: TA5
              value_col: adjustment
              label: "TA5 — adjustment"
            - identity:
                ta: TA5
              value_col: total
              label: "TA5 — total"
              bold: true
        rollup: $year_rollup
      - kind: spacer
        rows: 2
      - kind: title
        text: "Manual revenue adjustments (per-TA per-month)"
      - kind: paragraph
        italic: true
        text: "Each row adds `value` to one (TA, month) cell on top of modeled + HubSpot. Used to reproduce v4's hand-edited budget tweaks: Jan/Feb/Mar 2026 Ophthalmology formulas (`+ 33,165 × 1.32 − 8,000`, `+ 12,869 × 1.32`, `+ 31,919 × 1.32 − 26,900`) and the Oct/Nov/Dec 2026 hardcoded +$50k/mo pasted into Revenue!row 19. Together these close the previously-documented 2026 gap of $217,998. Edit `value` to tune; idx/date are read-only labels."
      - kind: table
        id: adjustments
        source: revenue_adjustments_t
        rows:
          kind: table-rows
          label_col: idx
          label_header: "#"
          column_formats:
            month_idx: integer
            value: money
        canonical: [revenue_adjustments_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Monthly revenue ($)"
      - kind: table
        id: monthly
        source: ta_monthly_total
        axis: $month_axis
        rows:
          kind: explicit
          rows:
            - source: hubspot_total_monthly
              identity: {}
              value_col: hubspot
              label: "HubSpot pipeline (subtotal)"
              bold: true
            - for_each: $active_tas
              as: ta
              identity:
                ta: "{ta}"
              value_col: total
              label: "{ta}"
            - source: modeled_total_monthly
              identity: {}
              value_col: total
              label: "Modeled TAs (subtotal)"
              bold: true
            - source: revenue_monthly
              identity: {}
              value_col: revenue
              label: "Grand total (HubSpot + modeled)"
              bold: true
        rollup: $year_rollup

  - id: employees
    label: Employees
    hint: "Headcount roster and monthly cost build-up (loaded salary × inflation)."
    blocks:
      - kind: title
        text: Cost assumptions
      - kind: table
        id: assumptions
        source: employee_assumptions_t
        rows:
          kind: value-columns
          columns:
            - col: ni_rate
              label: NI rate
              format: percent
            - col: pension_rate
              label: Pension rate
              format: percent
            - col: inflation_rate
              label: Annual inflation rate
              format: percent
            - col: inflation_start_year
              label: Inflation start year
              format: integer
            - col: inflation_start_month
              label: Inflation start month
              format: integer
        canonical: [employee_assumptions_t]
      - kind: spacer
        rows: 1
      - kind: table
        id: assumptions-flags
        source: employee_assumptions_t
        rows:
          kind: value-columns
          columns:
            - col: max_inflation_steps
              label: "Max inflation steps (v4 bug: 4)"
              format: integer
            - col: inflate_future_hires
              label: "Inflate future hires (v4 bug: false)"
        canonical: [employee_assumptions_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Salary adjustments (per-employee monthly multipliers)"
      - kind: paragraph
        italic: true
        text: "Each row sets a multiplier on one employee's cleanly-computed monthly cost that applies from `month_idx` forward until a later row for the same employee overrides it. Default rows reproduce v4's hand-edited per-cell tweaks: Naaman Tammuz ×0.8 from Apr 2026, Blaise Thomson ×0.66 from Apr 2026 then ×2.8052 from Apr 2027 (tracks Naaman's salary). Edit the factor and note columns; the employee, month, and date are read-only labels."
      - kind: table
        id: salary-adjustments
        source: employee_adjustments_sparse_t
        rows:
          kind: table-rows
          label_col: employee_id
          label_header: Employee ID
          column_formats:
            month_idx: integer
            factor: decimal
        canonical: [employee_adjustments_sparse_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: Employees roster
      - kind: table
        id: roster
        source: employees_t
        rows:
          kind: table-rows
          label_col: id
          label_header: ID
        canonical: [employees_t]
      - kind: spacer
        rows: 2
      - kind: chart
        id: headcount
        ref: staff-headcount
        title: "Staff headcount over time"
      - kind: spacer
        rows: 1
      - kind: title
        text: "Employee cost by department × month (with actuals overlay)"
      - kind: table
        id: cost-by-dept
        source: cost_dept_total_monthly_with_actuals
        axis: $month_axis
        rows:
          kind: pivot-rows
          label_header: Department
          label_col: cost_dept
          value_col: staff
          format: money
        totals_row:
          label: Total employee cost
          bold: true
        rollup: $year_rollup

  - id: costs
    label: Costs
    hint: "Per-department budgets: Staff Costs (from Employees), Sales Commission (derived, S&M only), line items, and total — laid out like the v4 spreadsheet."
    blocks:
      - kind: title
        text: Departmental cost detail
      - kind: repeat
        template: per_dept_sm
        over: ["Sales and Marketing"]
        bind: dept
      - kind: repeat
        template: per_dept_other
        over: ["G&A", Engineering, "Product Support"]
        bind: dept
      - kind: title
        text: "Roll-up: all departments (with actuals overlay)"
      - kind: table
        id: rollup
        source: cost_dept_total_monthly_with_actuals
        axis: $month_axis
        rows:
          kind: pivot-rows
          label_header: Department
          label_col: cost_dept
          value_col: total
          format: money
        totals_row:
          label: Total opex
          bold: true
        rollup: $year_rollup
      - kind: spacer
        rows: 2
      - kind: title
        text: "Per-dept yearly opex (derived from monthly + actuals)"
      - kind: repeat
        template: per_dept_yearly
        over: $cost_depts
        bind: dept
      - kind: spacer
        rows: 2
      - kind: title
        text: "Per-dept monthly actuals (override modeled values)"
      - kind: paragraph
        italic: true
        text: "Pin per-dept monthly opex to specific values when the modeled output drifts from v4 (e.g. G&A staff cost where v4's Employees sheet uses ad-hoc per-employee multipliers — David Friend × 0.66, blank \"Extra\" rows, no inflation in some cells — that our clean 5%-each-April model doesn't replicate). Blank cells fall through to the modeled value. Yearly per-dept totals above derive automatically."
      - kind: repeat
        template: per_dept_actuals
        over: $cost_depts
        bind: dept

  - id: budget
    label: Budget P&L
    hint: "Profit & Loss layout matching the v4 Budgets sheet — revenue per TA, cost of sales, gross profit, opex per dept, EBITDA."
    blocks:
      - kind: title
        text: "Capital depreciation (input — booked below EBITDA)"
      - kind: table
        id: depreciation
        source: depreciation_t
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: value
              label: Capital depreciation
        rollup: $year_rollup
        canonical: [depreciation_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "R&D tax credit (input — booked below operating profit)"
      - kind: paragraph
        italic: true
        text: "Per-month R&D tax credit (positive = credit). Defaults reproduce v4: $437k 2026, $330k 2027, $330k 2028, $0 thereafter — smoothed evenly across each year. Edit any monthly cell to override."
      - kind: table
        id: rd-tax
        source: rd_tax_credit_t
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: value
              label: "R&D tax credit"
        rollup: $year_rollup
        canonical: [rd_tax_credit_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Interest income (input — booked between EBITDA and operating profit)"
      - kind: paragraph
        italic: true
        text: "Per-month interest income on cash (positive = income). Defaults reproduce v4 (Budgets!G48/H48): £21,975 in Jan-2026 and £1,579 in Feb-2026, then £0 — v4 carries no interest beyond Q1-2026. Edit any cell to model interest on the running cash balance in later periods."
      - kind: table
        id: interest
        source: interest_income_t
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: value
              label: Interest income
        rollup: $year_rollup
        canonical: [interest_income_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Sales commission overrides (per-month)"
      - kind: paragraph
        italic: true
        text: "v4's S&M Commission line is fully hardcoded — every monthly cell is a pasted value with no underlying formula, and the late-year values plateau around $145k/month, well below what our cap-based formula `min(6k×starts + 12%×revenue, 1.5 × Total Sales Salary)` produces. Each cell here overrides the modelled value for that month. Defaults are populated from v4 (costs_data.json) so we match S&M Commission to the cent out of the box. Clear a cell to fall back to the formula."
      - kind: table
        id: sales-commission-overrides
        source: sales_commission_overrides_t
        axis: $month_axis
        rows:
          kind: value-columns
          columns:
            - col: value
              label: "Sales commission (override; blank = formula)"
        rollup: $year_rollup
        canonical: [sales_commission_overrides_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Modeller commission adjustments (per-month additions)"
      - kind: paragraph
        italic: true
        text: "Each row adds `value` (positive = additional cost) to the modelled monthly modeller commission. Defaults reproduce v4's four hand-entered Jan/Feb/Mar/May 2026 Budgets!row 22 entries — historic commitments paid before the AI-revenue ramp begins (where our `min(0.8 × AI_revenue, $30k)` formula yields $0). The May entry is a $5,000 hardcoded value with no formula in v4; Jan/Feb/Mar are GBP amounts scaled by 1.32 USD/GBP. Edit `value` to tune; idx/date are read-only labels."
      - kind: table
        id: commission-adjustments
        source: modeller_commission_adjustments_t
        rows:
          kind: table-rows
          label_col: idx
          label_header: "#"
          column_formats:
            month_idx: integer
            value: money
        canonical: [modeller_commission_adjustments_t]
      - kind: spacer
        rows: 2
      - kind: title
        text: "Profit & Loss (monthly — with actuals overlay)"
      - kind: table
        id: pnl-monthly
        source: budget_monthly_with_actuals
        axis: $month_axis
        rows:
          kind: explicit
          label_header: Line
          rows:
            - for_each: $active_tas
              as: ta
              source: ta_monthly_total
              identity:
                ta: "{ta}"
              value_col: total
              label: "{ta}"
            - source: hubspot_total_monthly
              identity: {}
              value_col: hubspot
              label: "HubSpot pipeline (subtotal)"
            - source: budget_monthly_with_actuals
              identity: {}
              value_col: revenue
              label: Total Revenue
              bold: true
            - source: modeller_commission_monthly
              identity: {}
