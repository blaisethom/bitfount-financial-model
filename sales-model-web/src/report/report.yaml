        source: bs_summary_monthly_with_actuals
        axis: $month_axis
        rows:
          kind: explicit
          label_header: Line
          rows:
            - source: bs_summary_monthly_with_actuals
              identity: {}
              value_col: intangible_assets
              label: Intangible Assets
            - source: bs_summary_monthly_with_actuals
              identity: {}
