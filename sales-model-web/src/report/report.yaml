        default_format: money
      - kind: paragraph
        italic: true
        text: "Modeling notes: (1) Tangible assets follow the per-month capex schedule less cumulative depreciation, floored at 0 — v4's depreciation schedule writes off more than was ever capitalised (~$189k over the horizon), so the raw book value would go negative; we floor it and add the disallowed depreciation back to Current Earnings so the sheet still balances. (2) Trade debtors = revenue × AR days / 30; the four other working-capital lines (trade creditors, other debtors, VAT, other creditors) come from per-month v4 closing balances in bs_monthly_schedule_t. (3) Current earnings = cumulative profit-after-tax (EBITDA − depreciation + R&D tax credit), so the BS reflects the real post-tax position within the limit that we don't model Corporation Tax (kicks in 2029+ in v4, ~19% of operating profit). (4) Cash = opening + cum PaT + cum depreciation add-back − cum capex − cum loan repayments − ΔWC — textbook indirect-method waterfall, so the BS balances (Difference rounds to zero). (5) Reconciliation to v4: v4 rebases opening retained earnings at Jan-2026 by +£398,942 above what its own Dec-2025 close supports (an unreconciled v4 restatement). We keep the correct figure, so our Net Assets sits ~£417k below v4 every year; the \"v4 opening restatement\" add-back and \"Net Assets (v4 basis)\" lines make this explicit — the v4-basis figure ties to v4 within the ~£18k current-earnings timing difference."
