              label: "US Travel"
            - identity: { row_id: us_other }
              value_col: value
              label: "US Other"
      - kind: title
        text: "G&A"
        level: 2
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: altris_commission }
              value_col: value
              label: "Altris Modeller Commission"
            - identity: { row_id: computers }
              value_col: value
              label: "Computers for Customers"
            - identity: { row_id: ga_accountants }
              value_col: value
              label: "Accountants"
            - identity: { row_id: ga_grenke }
              value_col: value
              label: "Grenke Leasing"
            - identity: { row_id: ga_cf }
              value_col: value
              label: "CF Corporate Finance"
            - identity: { row_id: ga_fora }
              value_col: value
              label: "Fora Space"
            - identity: { row_id: ga_insurance }
              value_col: value
              label: "Life Insurance / Health"
            - identity: { row_id: ga_bank }
              value_col: value
              label: "Bank fees"
            - identity: { row_id: ga_baker_tilley }
              value_col: value
              label: "Baker Tilley"
            - identity: { row_id: ga_it_hw }
              value_col: value
              label: "IT Software & Hardware"
            - identity: { row_id: ga_it_sec }
              value_col: value
              label: "IT Security & Compliance"
            - identity: { row_id: ga_ikites }
              value_col: value
              label: "Ikites — IT Services US"
            - identity: { row_id: ga_legal_edge }
              value_col: value
              label: "Legal Edge"
            - identity: { row_id: ga_hr_lawyers }
              value_col: value
              label: "HR Lawyers"
            - identity: { row_id: ga_ip_lawyers }
              value_col: value
              label: "IP Lawyers"
            - identity: { row_id: ga_recruitment }
              value_col: value
              label: "Recruitment"
            - identity: { row_id: ga_welfare }
              value_col: value
              label: "Staff Welfare"
            - identity: { row_id: ga_travel }
              value_col: value
              label: "Travel"
            - identity: { row_id: ga_bluejay }
              value_col: value
              label: "Bluejay Holdings"
            - identity: { row_id: ga_ppd_repay }
              value_col: value
              label: "PPD Repayment"
            - identity: { row_id: ga_general }
              value_col: value
