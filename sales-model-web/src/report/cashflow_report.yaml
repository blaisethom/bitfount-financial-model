            - identity: { row_id: fr_v2s }
              value_col: value
              label: "Venture to Success"
            - identity: { row_id: fr_alex }
              value_col: value
              label: "Alexander Champion"
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Total"
          rows:
            - identity: { row_id: total_outflows }
              value_col: value
              label: "Total outflows"
              bold: true

  - id: cashflow-bank
    label: Bank Accounts
    blocks:
      - kind: title
        text: "Bank Accounts (GBP equivalent)"
        level: 1
      - kind: paragraph
        text: "Actual bank balances — reconciliation between model and observed cash."
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rows:
          kind: explicit
          label_header: "Account"
          rows:
            - identity: { row_id: bank_us }
              value_col: value
              label: "US"
            - identity: { row_id: bank_hsbc_usd }
              value_col: value
              label: "HSBC USD"
            - identity: { row_id: bank_hsbc_gbp }
              value_col: value
              label: "HSBC GBP"
            - identity: { row_id: bank_revolut_usd }
              value_col: value
              label: "Revolut USD"
            - identity: { row_id: bank_telleroo }
              value_col: value
              label: "Telleroo"
            - identity: { row_id: bank_revolut_gbp }
              value_col: value
              label: "Revolut GBP"
            - identity: { row_id: bank_barclays }
              value_col: value
              label: "Barclays GBP"
            - identity: { row_id: bank_total }
              value_col: value
              label: "Total cash (actual)"
              bold: true
            - identity: { row_id: bank_diff }
              value_col: value
              label: "Difference (model vs actual)"
            - identity: { row_id: insignis }
              value_col: value
              label: "Insignis (long-term deposit)"
