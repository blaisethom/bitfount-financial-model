        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: sm_advertising }
              value_col: value
              label: "Advertising"
            - identity: { row_id: sm_exhibitions }
