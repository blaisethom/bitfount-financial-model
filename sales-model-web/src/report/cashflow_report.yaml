calendar: weeks_t

vars:
  week_axis:
    col: month_idx
    labels: dates
  year_rollup:
    year_totals: true
    grand_total: false

sections:
  - id: cashflow-summary
    label: Cash Summary
    blocks:
      - kind: title
        text: "Weekly Cash Flow"
        level: 1
      - kind: paragraph
        text: "Opening balance, total inflows, total outflows, and closing balance — week by week. Values in GBP."
      - kind: chart
        ref: closing_balance_t
        title: "Closing cash balance (weekly)"
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: opening_balance }
              value_col: value
              label: "Opening cash balance"
              bold: true
            - identity: { row_id: total_inflow }
              value_col: value
              label: "Total inflow"
              bold: true
            - identity: { row_id: total_outflows }
              value_col: value
              label: "Total outflows"
              bold: true
            - identity: { row_id: closing_balance }
              value_col: value
              label: "Closing cash balance"
              bold: true
            - identity: { row_id: closing_prior }
              value_col: value
              label: "Closing balance (prior forecast)"

  - id: cashflow-inflows
    label: Inflows
    blocks:
      - kind: title
        text: "Inflows"
        level: 1
      - kind: title
        text: "Invoiced"
        level: 2
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: inv_character }
              value_col: value
              label: "Character"
            - identity: { row_id: inv_bi }
              value_col: value
              label: "BI"
            - identity: { row_id: inv_bi2 }
              value_col: value
              label: "BI (2)"
            - identity: { row_id: inv_bi3 }
              value_col: value
              label: "BI (3)"
            - identity: { row_id: inv_bi4 }
              value_col: value
              label: "BI (4)"
      - kind: title
        text: "Other inflows"
        level: 2
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: us_commission }
              value_col: value
              label: "US Salaries — commission"
            - identity: { row_id: ltd_deposit }
              value_col: value
              label: "Long-term deposit cash"
            - identity: { row_id: rd_tax }
              value_col: value
              label: "R&D Tax Credit"
            - identity: { row_id: invest_income }
              value_col: value
              label: "Investment income"
            - identity: { row_id: vat }
              value_col: value
              label: "VAT"
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Total"
          rows:
            - identity: { row_id: total_inflow }
              value_col: value
              label: "Total inflow"
              bold: true

  - id: cashflow-outflows
    label: Outflows
    blocks:
      - kind: title
        text: "Outflows"
        level: 1
      - kind: title
        text: "UK Payroll"
        level: 2
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: uk_salaries }
              value_col: value
              label: "UK Salaries"
            - identity: { row_id: uk_pension }
              value_col: value
              label: "UK Pension"
            - identity: { row_id: uk_salary_tax }
              value_col: value
              label: "UK Salary tax"
            - identity: { row_id: uk_psa }
              value_col: value
              label: "PSA"
            - identity: { row_id: uk_commission }
              value_col: value
              label: "UK Commission"
      - kind: title
        text: "US Payroll"
        level: 2
      - kind: table
        source: cashflow_t
        axis: $week_axis
        default_format: money
        rollup: $year_rollup
        rows:
          kind: explicit
          label_header: "Line item"
          rows:
            - identity: { row_id: us_salaries }
              value_col: value
              label: "US Salaries"
            - identity: { row_id: us_cust_success }
